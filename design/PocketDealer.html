  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Schibsted Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"eed1624a-cfe4-4540-910d-5b27ff1450e3\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>body{margin:0;background:#EDEBE6;font-family:'Schibsted Grotesk',system-ui,sans-serif;color:#191919}a{color:#0E5A3C}a:hover{color:#0A4630}@keyframes pd-pulse{0%,100%{opacity:1}50%{opacity:.3}}input[type=range]{accent-color:#191919;width:100%}input::placeholder{color:#B5AFA5}<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 16px 48px;box-sizing:border-box\">\n  <sc-if value=\"{{ simBarOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;flex-direction:column;align-items:center;gap:7px\">\n      <div style=\"font:500 11px 'Schibsted Grotesk';color:#8A857C;letter-spacing:.3px\">Demo — each player would use their own phone<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:6px\">\n        <sc-for list=\"{{ simPlayers }}\" as=\"p\" hint-placeholder-count=\"0\">\n          <button sc-camel-on-click=\"{{ p.on }}\" style=\"padding:7px 13px;border-radius:999px;border:1px solid rgba(0,0,0,.14);background:{{ p.bg }};color:{{ p.fg }};font:600 12px 'Schibsted Grotesk';cursor:pointer;display:flex;align-items:center;gap:6px\">\n            <sc-if value=\"{{ p.acting }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:6px;height:6px;border-radius:50%;background:#2E9E6B;animation:pd-pulse 1.2s infinite\"><\u002Fspan><\u002Fsc-if>\n            {{ p.name }}\n          <\u002Fbutton>\n        <\u002Fsc-for>\n        <button sc-camel-on-click=\"{{ toggleAutoF }}\" style=\"padding:7px 13px;border-radius:999px;border:1px dashed rgba(0,0,0,.2);background:transparent;color:{{ autoFColor }};font:600 12px 'Schibsted Grotesk';cursor:pointer\">auto-follow {{ autoFLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"width:390px;max-width:100%;background:#FBFAF8;border:1px solid rgba(0,0,0,.1);border-radius:32px;box-shadow:0 24px 60px -30px rgba(0,0,0,.3);overflow:hidden;display:flex;flex-direction:column;min-height:780px;box-sizing:border-box\">\n    <div style=\"height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font:600 12px 'Schibsted Grotesk';color:#B5AFA5\"><span>9:41<\u002Fspan><span>{{ phoneOwner }}<\u002Fspan><\u002Fdiv>\n\n    <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n      <div data-screen-label=\"Home\" style=\"flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 28px 40px;gap:0\">\n        <div style=\"font-size:40px;line-height:1\">♠<\u002Fdiv>\n        <h1 style=\"margin:18px 0 8px;font:800 32px/1.05 'Schibsted Grotesk';letter-spacing:-.8px\">Pocket<br>Dealer<\u002Fh1>\n        <p style=\"margin:0 0 36px;font:400 15px/1.5 'Schibsted Grotesk';color:#8A857C;text-wrap:pretty\">The chips live here.<br>The cards stay on the table.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <button sc-camel-on-click=\"{{ goHost }}\" style=\"height:56px;border-radius:16px;border:none;background:#191919;color:#fff;font:600 16px 'Schibsted Grotesk';cursor:pointer\">Host a game<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goJoin }}\" style=\"height:56px;border-radius:16px;border:1.5px solid rgba(0,0,0,.18);background:transparent;color:#191919;font:600 16px 'Schibsted Grotesk';cursor:pointer\">Join with code<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isHostSetup }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Host setup\" style=\"flex:1;display:flex;flex-direction:column;padding:8px 24px 24px;gap:22px\">\n        <div style=\"display:flex;align-items:center;gap:12px\"><button sc-camel-on-click=\"{{ goHome }}\" style=\"width:38px;height:38px;border-radius:12px;border:1px solid rgba(0,0,0,.14);background:#fff;cursor:pointer;font-size:16px\">←<\u002Fbutton><span style=\"font:700 20px 'Schibsted Grotesk'\">Host a game<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <label style=\"font:600 11px 'Schibsted Grotesk';color:#8A857C;text-transform:uppercase;letter-spacing:1px\">Your name<\u002Flabel>\n          <input value=\"{{ hostName }}\" sc-camel-on-change=\"{{ onHostName }}\" style=\"width:100%;box-sizing:border-box;padding:14px 16px;border-radius:14px;border:1px solid rgba(0,0,0,.15);background:#fff;font:500 16px 'Schibsted Grotesk';outline:none\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <label style=\"font:600 11px 'Schibsted Grotesk';color:#8A857C;text-transform:uppercase;letter-spacing:1px\">Blinds<\u002Flabel>\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:8px\">\n            <sc-for list=\"{{ blindOpts }}\" as=\"b\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ b.on }}\" style=\"height:46px;border-radius:12px;border:1.5px solid {{ b.bc }};background:{{ b.bg }};color:{{ b.fg }};font:600 14px 'Schibsted Grotesk';cursor:pointer\">{{ b.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <label style=\"font:600 11px 'Schibsted Grotesk';color:#8A857C;text-transform:uppercase;letter-spacing:1px\">Starting stack<\u002Flabel>\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:8px\">\n            <sc-for list=\"{{ stackOpts }}\" as=\"b\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ b.on }}\" style=\"height:46px;border-radius:12px;border:1.5px solid {{ b.bc }};background:{{ b.bg }};color:{{ b.fg }};font:600 14px 'Schibsted Grotesk';cursor:pointer\">{{ b.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ createRoom }}\" style=\"margin-top:auto;height:56px;border-radius:16px;border:none;background:#191919;color:#fff;font:600 16px 'Schibsted Grotesk';cursor:pointer\">Create room<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isJoin }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Join\" style=\"flex:1;display:flex;flex-direction:column;padding:8px 24px 24px;gap:22px\">\n        <div style=\"display:flex;align-items:center;gap:12px\"><button sc-camel-on-click=\"{{ goHome }}\" style=\"width:38px;height:38px;border-radius:12px;border:1px solid rgba(0,0,0,.14);background:#fff;cursor:pointer;font-size:16px\">←<\u002Fbutton><span style=\"font:700 20px 'Schibsted Grotesk'\">Join a game<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <label style=\"font:600 11px 'Schibsted Grotesk';color:#8A857C;text-transform:uppercase;letter-spacing:1px\">Room code<\u002Flabel>\n          <div style=\"padding:18px;border-radius:14px;border:1px solid rgba(0,0,0,.12);background:#fff;text-align:center;font:700 26px 'Schibsted Grotesk';letter-spacing:6px\">{{ roomCode }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <label style=\"font:600 11px 'Schibsted Grotesk';color:#8A857C;text-transform:uppercase;letter-spacing:1px\">Your name<\u002Flabel>\n          <input value=\"{{ joinName }}\" sc-camel-on-change=\"{{ onJoinName }}\" style=\"width:100%;box-sizing:border-box;padding:14px 16px;border-radius:14px;border:1px solid rgba(0,0,0,.15);background:#fff;font:500 16px 'Schibsted Grotesk';outline:none\">\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ joinGo }}\" style=\"margin-top:auto;height:56px;border-radius:16px;border:none;background:#191919;color:#fff;font:600 16px 'Schibsted Grotesk';cursor:pointer\">Join table<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isLobby }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Lobby\" style=\"flex:1;display:flex;flex-direction:column;padding:8px 24px 24px;gap:18px\">\n        <div style=\"text-align:center;padding:22px 0 4px\">\n          <div style=\"font:600 11px 'Schibsted Grotesk';color:#8A857C;text-transform:uppercase;letter-spacing:1.5px\">Room code<\u002Fdiv>\n          <div style=\"font:800 34px 'Schibsted Grotesk';letter-spacing:8px;margin-top:6px\">{{ roomCode }}<\u002Fdiv>\n          <div style=\"font:400 13px 'Schibsted Grotesk';color:#8A857C;margin-top:6px\">Blinds {{ blindsLabel }} · Stack {{ stackLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(0,0,0,.1);border-radius:16px;background:#fff;overflow:hidden\">\n          <sc-for list=\"{{ lobbyRows }}\" as=\"p\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid rgba(0,0,0,.06)\">\n              <div style=\"width:36px;height:36px;border-radius:50%;background:#EAE6DE;display:flex;align-items:center;justify-content:center;font:700 14px 'Schibsted Grotesk'\">{{ p.initial }}<\u002Fdiv>\n              <div style=\"flex:1;font:600 15px 'Schibsted Grotesk'\">{{ p.name }} <span style=\"font:500 11px 'Schibsted Grotesk';color:#8A857C\">{{ p.tag }}<\u002Fspan><\u002Fdiv>\n              <div style=\"font:600 14px 'Schibsted Grotesk';font-variant-numeric:tabular-nums\">{{ p.stackFmt }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ addDemo }}\" style=\"height:48px;border-radius:14px;border:1.5px dashed rgba(0,0,0,.22);background:transparent;color:#5A554C;font:600 14px 'Schibsted Grotesk';cursor:pointer\">+ Simulate a player joining<\u002Fbutton>\n        <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:8px\">\n          <sc-if value=\"{{ cantStart }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"text-align:center;font:500 12px 'Schibsted Grotesk';color:#8A857C\">Need at least 2 players to start<\u002Fdiv><\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ startGame }}\" style=\"height:56px;border-radius:16px;border:none;background:#191919;color:#fff;font:600 16px 'Schibsted Grotesk';cursor:pointer;opacity:{{ startOpacity }}\">Start game<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isTable }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Table\" style=\"flex:1;display:flex;flex-direction:column\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;padding:6px 22px 0\">\n          <span style=\"font:600 11px 'Schibsted Grotesk';color:#B5AFA5;letter-spacing:1px\">{{ roomCode }}<\u002Fspan>\n          <span style=\"padding:5px 12px;border-radius:999px;border:1px solid rgba(0,0,0,.14);font:700 11px 'Schibsted Grotesk';text-transform:uppercase;letter-spacing:1.5px\">{{ streetLabel }}<\u002Fspan>\n          <span style=\"font:600 11px 'Schibsted Grotesk';color:#B5AFA5;letter-spacing:1px\">HAND {{ handNo }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"text-align:center;padding:18px 0 14px\">\n          <div style=\"font:600 11px 'Schibsted Grotesk';color:#8A857C;text-transform:uppercase;letter-spacing:2px\">Pot<\u002Fdiv>\n          <div style=\"font:800 42px/1.1 'Schibsted Grotesk';font-variant-numeric:tabular-nums;letter-spacing:-1px\">{{ potFmt }}<\u002Fdiv>\n          <div style=\"font:400 12px 'Schibsted Grotesk';color:#8A857C;margin-top:2px\">Blinds {{ blindsLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin:0 16px;border:1px solid rgba(0,0,0,.09);border-radius:16px;background:#fff;overflow:hidden\">\n          <sc-for list=\"{{ tableRows }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid rgba(0,0,0,.05);background:{{ p.bg }};opacity:{{ p.op }}\">\n              <div style=\"width:26px;height:26px;border-radius:50%;border:1.5px solid {{ p.roleBc }};color:{{ p.roleFg }};display:flex;align-items:center;justify-content:center;font:700 9px 'Schibsted Grotesk'\">{{ p.role }}<\u002Fdiv>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font:600 14px 'Schibsted Grotesk';display:flex;align-items:center;gap:6px\">{{ p.label }}\n                  <sc-if value=\"{{ p.acting }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:6px;height:6px;border-radius:50%;background:#2E9E6B;animation:pd-pulse 1.2s infinite\"><\u002Fspan><\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"font:500 12px 'Schibsted Grotesk';color:#8A857C;font-variant-numeric:tabular-nums\">{{ p.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font:700 14px 'Schibsted Grotesk';font-variant-numeric:tabular-nums;color:#0E5A3C\">{{ p.betFmt }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:auto;border-top:1px solid rgba(0,0,0,.08);background:#fff;padding:16px 20px 22px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px\">\n            <div><div style=\"font:600 11px 'Schibsted Grotesk';color:#8A857C;text-transform:uppercase;letter-spacing:1px\">Your stack<\u002Fdiv>\n            <div style=\"font:800 26px 'Schibsted Grotesk';font-variant-numeric:tabular-nums\">{{ myStackFmt }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"font:600 13px 'Schibsted Grotesk';color:#8A857C;font-variant-numeric:tabular-nums\">{{ toCallLine }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showWaiting }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"height:52px;border-radius:14px;background:#F2F0EB;display:flex;align-items:center;justify-content:center;gap:8px;font:600 14px 'Schibsted Grotesk';color:#8A857C\"><span style=\"width:7px;height:7px;border-radius:50%;background:#2E9E6B;animation:pd-pulse 1.2s infinite\"><\u002Fspan>{{ waitingLabel }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ showActions }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;gap:8px\">\n              <button sc-camel-on-click=\"{{ doFold }}\" style=\"flex:1;height:54px;border-radius:14px;border:1.5px solid rgba(179,64,46,.45);background:transparent;color:#B3402E;font:600 15px 'Schibsted Grotesk';cursor:pointer\">Fold<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ doCheckCall }}\" style=\"flex:1.25;height:54px;border-radius:14px;border:1.5px solid rgba(0,0,0,.2);background:transparent;color:#191919;font:600 15px 'Schibsted Grotesk';cursor:pointer\">{{ callLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ openRaise }}\" style=\"flex:1.25;height:54px;border-radius:14px;border:none;background:#191919;color:#fff;font:600 15px 'Schibsted Grotesk';cursor:pointer\">{{ raiseBtnLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ raiseOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <div style=\"text-align:center;font:800 32px 'Schibsted Grotesk';font-variant-numeric:tabular-nums\">{{ raiseToFmt }}<\u002Fdiv>\n              <input type=\"range\" min=\"{{ raiseMin }}\" max=\"{{ raiseMax }}\" step=\"{{ raiseStep }}\" value=\"{{ raiseTo }}\" sc-camel-on-change=\"{{ onRaiseSlider }}\">\n              <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:8px\">\n                <sc-for list=\"{{ presets }}\" as=\"pr\" hint-placeholder-count=\"4\">\n                  <button sc-camel-on-click=\"{{ pr.on }}\" style=\"height:38px;border-radius:10px;border:1px solid rgba(0,0,0,.16);background:#fff;font:600 12px 'Schibsted Grotesk';cursor:pointer\">{{ pr.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:8px\">\n                <button sc-camel-on-click=\"{{ closeRaise }}\" style=\"flex:1;height:52px;border-radius:14px;border:1.5px solid rgba(0,0,0,.18);background:transparent;font:600 15px 'Schibsted Grotesk';cursor:pointer\">Cancel<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ doRaise }}\" style=\"flex:2;height:52px;border-radius:14px;border:none;background:#0E5A3C;color:#fff;font:600 15px 'Schibsted Grotesk';cursor:pointer\">{{ raiseConfirmLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ showFoldedNote }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"height:52px;border-radius:14px;background:#F2F0EB;display:flex;align-items:center;justify-content:center;font:600 14px 'Schibsted Grotesk';color:#8A857C\">You folded this hand<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isShowdown }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Showdown\" style=\"flex:1;display:flex;flex-direction:column;padding:8px 20px 24px;gap:14px\">\n        <div style=\"padding:12px 4px 0\">\n          <div style=\"font:800 24px 'Schibsted Grotesk';letter-spacing:-.5px\">Showdown<\u002Fdiv>\n          <div style=\"font:400 13px/1.5 'Schibsted Grotesk';color:#8A857C;margin-top:4px;text-wrap:pretty\">Compare hands at the table, then tap the winner of each pot. Tap two names to split.<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ potsView }}\" as=\"pt\" hint-placeholder-count=\"1\">\n          <div style=\"border:1px solid rgba(0,0,0,.1);border-radius:16px;background:#fff;padding:16px\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n              <span style=\"font:600 12px 'Schibsted Grotesk';color:#8A857C;text-transform:uppercase;letter-spacing:1px\">{{ pt.label }}<\u002Fspan>\n              <span style=\"font:800 22px 'Schibsted Grotesk';font-variant-numeric:tabular-nums\">{{ pt.amtFmt }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ pt.open }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:12px\">\n                <sc-for list=\"{{ pt.players }}\" as=\"c\" hint-placeholder-count=\"2\">\n                  <button sc-camel-on-click=\"{{ c.on }}\" style=\"padding:10px 16px;border-radius:999px;border:1.5px solid {{ c.bc }};background:{{ c.bg }};color:{{ c.fg }};font:600 13px 'Schibsted Grotesk';cursor:pointer\">{{ c.name }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ pt.onAward }}\" style=\"width:100%;margin-top:12px;height:46px;border-radius:12px;border:none;background:#0E5A3C;color:#fff;font:600 14px 'Schibsted Grotesk';cursor:pointer;opacity:{{ pt.awardOp }}\">Award pot<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ pt.won }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:10px;font:600 14px 'Schibsted Grotesk';color:#0E5A3C\">→ {{ pt.winnersLabel }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isHandEnd }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Hand result\" style=\"flex:1;display:flex;flex-direction:column;padding:8px 24px 24px;gap:18px\">\n        <div style=\"text-align:center;padding:30px 0 6px\">\n          <div style=\"font-size:30px\">♠<\u002Fdiv>\n          <div style=\"font:800 22px/1.3 'Schibsted Grotesk';margin-top:10px;text-wrap:pretty\">{{ endMsg }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(0,0,0,.1);border-radius:16px;background:#fff;overflow:hidden\">\n          <sc-for list=\"{{ endRows }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid rgba(0,0,0,.06);opacity:{{ p.op }}\">\n              <div style=\"width:36px;height:36px;border-radius:50%;background:#EAE6DE;display:flex;align-items:center;justify-content:center;font:700 14px 'Schibsted Grotesk'\">{{ p.initial }}<\u002Fdiv>\n              <div style=\"flex:1;font:600 15px 'Schibsted Grotesk'\">{{ p.name }} <span style=\"font:500 11px 'Schibsted Grotesk';color:#8A857C\">{{ p.tag }}<\u002Fspan><\u002Fdiv>\n              <div style=\"font:700 15px 'Schibsted Grotesk';font-variant-numeric:tabular-nums\">{{ p.stackFmt }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ nextHand }}\" style=\"margin-top:auto;height:56px;border-radius:16px;border:none;background:#191919;color:#fff;font:600 16px 'Schibsted Grotesk';cursor:pointer\">Next hand →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isGameOver }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Game over\" style=\"flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 28px 40px;gap:8px;text-align:center\">\n        <div style=\"font-size:40px\">♠<\u002Fdiv>\n        <div style=\"font:800 28px 'Schibsted Grotesk';letter-spacing:-.5px\">{{ endMsg }}<\u002Fdiv>\n        <div style=\"font:400 14px 'Schibsted Grotesk';color:#8A857C\">takes the whole table<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ resetAll }}\" style=\"margin-top:28px;height:54px;padding:0 36px;border-radius:16px;border:none;background:#191919;color:#fff;font:600 15px 'Schibsted Grotesk';cursor:pointer\">New game<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:920},&quot;currency&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;chips&quot;,&quot;$&quot;,&quot;NT$&quot;],&quot;default&quot;:&quot;chips&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Game&quot;},&quot;simBar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo&quot;}}\">\nclass Component extends DCLogic {\n  state = { screen: 'home', view: 0, autoF: true, cfg: { sb: 5, bb: 10, stack: 1000 }, hostName: 'Ming', joinName: 'Alex', roomCode: 'TBL-742', players: [], dealer: 0, sbI: -1, bbI: -1, street: 0, handNo: 1, currentBet: 0, minRaise: 0, acting: -1, acted: [], raiseOpen: false, raiseTo: 0, pots: null, endMsg: '' };\n\n  fmt(n) { const c = this.props.currency ?? 'chips'; const p = c === '$' ? '$' : c === 'NT$' ? 'NT$' : ''; return p + n.toLocaleString('en-US'); }\n  seats(ps) { return ps.map((p, i) => i); }\n  nextSeat(ps, i, skip) { let j = i, g = 0; do { j = (j + 1) % ps.length; g++; } while (g <= ps.length && (ps[j].out || (skip && (ps[j].folded || ps[j].allIn)))); return j; }\n  actives(ps) { return this.seats(ps).filter(i => !ps[i].folded && !ps[i].out); }\n\n  startHand(ps0, dealer, handNo) {\n    const ps = ps0.map(p => ({ ...p, committed: 0, total: 0, folded: !!p.out, allIn: false }));\n    const alive = ps.filter(p => !p.out).length;\n    const { sb, bb } = this.state.cfg;\n    const pay = (i, amt) => { const p = ps[i]; const a = Math.min(amt, p.stack); p.stack -= a; p.committed += a; p.total += a; if (p.stack === 0) p.allIn = true; };\n    const sbI = alive === 2 ? dealer : this.nextSeat(ps, dealer);\n    const bbI = this.nextSeat(ps, sbI);\n    pay(sbI, sb); pay(bbI, bb);\n    let act = this.nextSeat(ps, bbI, true);\n    const st = { players: ps, dealer, sbI, bbI, street: 0, handNo, currentBet: bb, minRaise: bb, acting: act, acted: [], raiseOpen: false, pots: null, endMsg: '', screen: 'table' };\n    if (this.state.autoF) st.view = act;\n    return st;\n  }\n\n  afterAction(st) {\n    const ps = st.players;\n    const act = this.actives(ps);\n    if (act.length === 1) {\n      const w = act[0]; const pot = ps.reduce((s, p) => s + p.total, 0);\n      ps[w].stack += pot; ps.forEach(p => { p.committed = 0; p.total = 0; });\n      st.endMsg = ps[w].name + ' wins ' + this.fmt(pot); st.screen = 'handEnd'; st.acting = -1; return st;\n    }\n    const needs = i => { const p = ps[i]; return !p.folded && !p.out && !p.allIn && (p.committed < st.currentBet || !st.acted.includes(i)); };\n    let j = st.acting;\n    for (let k = 0; k < ps.length; k++) { j = (j + 1) % ps.length; if (needs(j)) { st.acting = j; if (this.state.autoF) st.view = j; return st; } }\n    const canAct = act.filter(i => !ps[i].allIn);\n    ps.forEach(p => { p.committed = 0; });\n    st.currentBet = 0; st.minRaise = this.state.cfg.bb; st.acted = [];\n    if (st.street >= 3 || canAct.length < 2) {\n      st.street = 4; st.acting = -1;\n      st.pots = this.buildPots(ps);\n      st.pots.forEach(pt => { if (pt.elig.length === 1) { ps[pt.elig[0]].stack += pt.amt; pt.won = true; pt.winners = [pt.elig[0]]; } });\n      if (st.pots.every(pt => pt.won)) { st.endMsg = 'Pots returned'; st.screen = 'handEnd'; } else st.screen = 'showdown';\n      return st;\n    }\n    st.street++;\n    let a = st.dealer;\n    for (let k = 0; k < ps.length; k++) { a = (a + 1) % ps.length; if (!ps[a].folded && !ps[a].out && !ps[a].allIn) { st.acting = a; break; } }\n    if (this.state.autoF) st.view = st.acting;\n    return st;\n  }\n\n  buildPots(ps) {\n    const levels = [...new Set(ps.filter(p => p.total > 0).map(p => p.total))].sort((a, b) => a - b);\n    const pots = []; let prev = 0;\n    levels.forEach(L => {\n      let amt = 0; ps.forEach(p => { amt += Math.max(0, Math.min(p.total, L) - prev); });\n      const elig = this.seats(ps).filter(i => !ps[i].folded && !ps[i].out && ps[i].total >= L);\n      if (amt > 0) {\n        const last = pots[pots.length - 1];\n        if (last && last.elig.join() === elig.join()) last.amt += amt;\n        else pots.push({ amt, elig, sel: [], won: false, winners: [] });\n      }\n      prev = L;\n    });\n    return pots;\n  }\n\n  mut(fn) { const st = { ...this.state, players: this.state.players.map(p => ({ ...p })), acted: [...this.state.acted], pots: this.state.pots ? this.state.pots.map(pt => ({ ...pt, sel: [...pt.sel], winners: [...pt.winners] })) : null }; fn(st); this.setState(st); }\n  isMyTurn() { return this.state.screen === 'table' && this.state.acting === this.state.view && this.state.acting >= 0; }\n\n  act(kind, to) {\n    if (!this.isMyTurn()) return;\n    this.mut(st => {\n      const i = st.acting, p = st.players[i];\n      if (kind === 'fold') p.folded = true;\n      else if (kind === 'call') { const a = Math.min(st.currentBet - p.committed, p.stack); p.stack -= a; p.committed += a; p.total += a; if (p.stack === 0) p.allIn = true; st.acted.push(i); }\n      else { const a = Math.min(to - p.committed, p.stack); p.stack -= a; p.committed += a; p.total += a; if (p.stack === 0) p.allIn = true; const actual = p.committed; if (actual > st.currentBet) { if (actual - st.currentBet >= st.minRaise) st.minRaise = actual - st.currentBet; st.currentBet = actual; st.acted = [i]; } else st.acted.push(i); st.raiseOpen = false; }\n      this.afterAction(st);\n    });\n  }\n\n  award(pi) {\n    this.mut(st => {\n      const pt = st.pots[pi]; if (!pt || pt.won || pt.sel.length === 0) return;\n      const share = Math.floor(pt.amt / pt.sel.length); let rem = pt.amt - share * pt.sel.length;\n      pt.sel.forEach((w, k) => { st.players[w].stack += share + (k === 0 ? rem : 0); });\n      pt.winners = [...pt.sel]; pt.won = true;\n      if (st.pots.every(x => x.won)) {\n        const names = [...new Set(st.pots.flatMap(x => x.winners.map(w => st.players[w].name)))];\n        st.endMsg = names.join(' & ') + (names.length > 1 ? ' win the pots' : ' wins ' + this.fmt(st.pots.reduce((s, x) => s + x.amt, 0)));\n        st.players.forEach(p => { p.total = 0; }); st.screen = 'handEnd';\n      }\n    });\n  }\n\n  nextHand() {\n    this.mut(st => {\n      st.players.forEach(p => { if (p.stack === 0) p.out = true; });\n      const alive = st.players.filter(p => !p.out);\n      if (alive.length < 2) { st.screen = 'gameOver'; st.endMsg = alive[0].name + ' wins it all'; return; }\n      Object.assign(st, this.startHand(st.players, this.nextSeat(st.players, st.dealer), st.handNo + 1));\n    });\n  }\n\n  addPlayer(name) { this.mut(st => { st.players.push({ name, stack: st.cfg.stack, committed: 0, total: 0, folded: false, allIn: false, out: false }); }); }\n\n  renderVals() {\n    const s = this.state, ps = s.players, fmt = n => this.fmt(n);\n    const scr = s.screen;\n    const viewer = ps[s.view];\n    const streetLabel = ['Pre-flop', 'Flop', 'Turn', 'River', 'Showdown'][s.street] || '';\n    const pot = ps.reduce((t, p) => t + p.total, 0);\n    const toCall = viewer ? Math.max(0, s.currentBet - viewer.committed) : 0;\n    const canCheck = toCall <= 0;\n    const myTurn = this.isMyTurn();\n    const raiseMin = viewer ? Math.min(s.currentBet + s.minRaise, viewer.committed + viewer.stack) : 0;\n    const raiseMax = viewer ? viewer.committed + viewer.stack : 0;\n    const clamp = v => Math.max(raiseMin, Math.min(raiseMax, Math.round(v / s.cfg.sb) * s.cfg.sb));\n    const setTo = v => this.setState({ raiseTo: Math.max(raiseMin, Math.min(raiseMax, v)) });\n    const demoNames = ['Alex', 'Sam', 'Yuki', 'Rosa', 'Leo', 'Nadia'];\n    return {\n      isHome: scr === 'home', isHostSetup: scr === 'hostSetup', isJoin: scr === 'join', isLobby: scr === 'lobby', isTable: scr === 'table', isShowdown: scr === 'showdown', isHandEnd: scr === 'handEnd', isGameOver: scr === 'gameOver',\n      roomCode: s.roomCode, handNo: s.handNo, streetLabel, potFmt: fmt(pot), endMsg: s.endMsg,\n      blindsLabel: s.cfg.sb + ' / ' + s.cfg.bb, stackLabel: fmt(s.cfg.stack),\n      phoneOwner: ps.length && scr !== 'home' && scr !== 'hostSetup' && scr !== 'join' ? (viewer ? viewer.name + \"'s phone\" : '') : 'Pocket Dealer',\n      simBarOn: (this.props.simBar ?? true) && ps.length > 0 && !['home', 'hostSetup', 'join'].includes(scr),\n      simPlayers: ps.map((p, i) => ({ key: i, name: p.name, acting: i === s.acting, bg: i === s.view ? '#191919' : '#fff', fg: i === s.view ? '#fff' : '#191919', on: () => this.setState({ view: i, raiseOpen: false }) })),\n      toggleAutoF: () => this.setState({ autoF: !s.autoF }), autoFLabel: s.autoF ? 'on' : 'off', autoFColor: s.autoF ? '#0E5A3C' : '#8A857C',\n      goHost: () => this.setState({ screen: 'hostSetup' }), goJoin: () => this.setState({ screen: 'join' }), goHome: () => this.setState({ screen: 'home' }),\n      hostName: s.hostName, onHostName: e => this.setState({ hostName: e.target.value }),\n      joinName: s.joinName, onJoinName: e => this.setState({ joinName: e.target.value }),\n      blindOpts: [[1, 2], [2, 5], [5, 10], [10, 25]].map(([sb, bb]) => { const sel = s.cfg.sb === sb && s.cfg.bb === bb; return { key: sb, label: sb + ' / ' + bb, sel, bc: sel ? '#191919' : 'rgba(0,0,0,.14)', bg: sel ? '#191919' : '#fff', fg: sel ? '#fff' : '#191919', on: () => this.setState({ cfg: { ...s.cfg, sb, bb } }) }; }),\n      stackOpts: [500, 1000, 2000, 5000].map(v => { const sel = s.cfg.stack === v; return { key: v, label: v >= 1000 ? (v / 1000) + 'k' : '' + v, sel, bc: sel ? '#191919' : 'rgba(0,0,0,.14)', bg: sel ? '#191919' : '#fff', fg: sel ? '#fff' : '#191919', on: () => this.setState({ cfg: { ...s.cfg, stack: v } }) }; }),\n      createRoom: () => { this.setState({ players: [{ name: s.hostName || 'Host', stack: s.cfg.stack, committed: 0, total: 0, folded: false, allIn: false, out: false }], screen: 'lobby', view: 0 }); },\n      joinGo: () => { const base = ps.length ? ps : [{ name: 'Ming', stack: s.cfg.stack, committed: 0, total: 0, folded: false, allIn: false, out: false }]; const np = [...base.map(p => ({ ...p })), { name: s.joinName || 'Guest', stack: s.cfg.stack, committed: 0, total: 0, folded: false, allIn: false, out: false }]; this.setState({ players: np, screen: 'lobby', view: np.length - 1 }); },\n      lobbyRows: ps.map((p, i) => ({ key: i, name: p.name, initial: p.name[0].toUpperCase(), tag: i === 0 ? 'Host' : '', stackFmt: fmt(p.stack) })),\n      addDemo: () => { const used = ps.map(p => p.name); const name = demoNames.find(n => !used.includes(n)) || 'Player ' + (ps.length + 1); this.addPlayer(name); },\n      cantStart: ps.length < 2, startOpacity: ps.length < 2 ? 0.35 : 1,\n      startGame: () => { if (ps.length >= 2) this.setState(this.startHand(ps, 0, 1)); },\n      tableRows: ps.map((p, i) => {\n        const role = i === s.dealer ? 'D' : i === s.sbI ? 'SB' : i === s.bbI ? 'BB' : '';\n        const acting = i === s.acting;\n        return { key: i, label: i === s.view ? p.name + ' (you)' : p.name, role, roleBc: role ? '#191919' : 'rgba(0,0,0,.1)', roleFg: role ? '#191919' : 'transparent', acting, bg: acting ? '#F0F4EF' : 'transparent', op: p.folded || p.out ? 0.35 : 1, sub: p.out ? 'Out' : p.folded ? 'Folded' : p.allIn ? 'All-in' : fmt(p.stack), betFmt: p.committed > 0 ? fmt(p.committed) : '' };\n      }),\n      myStackFmt: viewer ? fmt(viewer.stack) : '', toCallLine: viewer && !viewer.folded && toCall > 0 ? 'To call ' + fmt(Math.min(toCall, viewer.stack)) : '',\n      showWaiting: !myTurn && viewer && !viewer.folded && !viewer.allIn, waitingLabel: viewer && viewer.allIn ? \"You're all-in\" : 'Waiting for ' + (ps[s.acting] ? ps[s.acting].name : '') + '…',\n      showActions: myTurn && !s.raiseOpen, showFoldedNote: !!(viewer && viewer.folded && scr === 'table'),\n      callLabel: canCheck ? 'Check' : viewer && toCall >= viewer.stack ? 'All-in ' + fmt(viewer.stack) : 'Call ' + fmt(toCall),\n      raiseBtnLabel: canCheck && s.currentBet === 0 ? 'Bet' : 'Raise',\n      doFold: () => this.act('fold'), doCheckCall: () => this.act('call'),\n      openRaise: () => { if (myTurn) this.setState({ raiseOpen: true, raiseTo: raiseMin }); },\n      closeRaise: () => this.setState({ raiseOpen: false }),\n      raiseOpen: s.raiseOpen && myTurn, raiseTo: s.raiseTo, raiseToFmt: fmt(s.raiseTo), raiseMin, raiseMax, raiseStep: s.cfg.sb,\n      onRaiseSlider: e => setTo(+e.target.value),\n      presets: [\n        { key: 'min', label: 'Min', on: () => setTo(raiseMin) },\n        { key: 'half', label: '½ pot', on: () => setTo(clamp(s.currentBet + Math.round(pot / 2))) },\n        { key: 'pot', label: 'Pot', on: () => setTo(clamp(s.currentBet + pot)) },\n        { key: 'allin', label: 'All-in', on: () => setTo(raiseMax) },\n      ],\n      raiseConfirmLabel: (s.currentBet === 0 ? 'Bet ' : 'Raise to ') + fmt(s.raiseTo),\n      doRaise: () => this.act('raise', s.raiseTo),\n      potsView: (s.pots || []).map((pt, pi) => ({\n        key: pi, label: pi === 0 ? 'Main pot' : 'Side pot ' + pi, amtFmt: fmt(pt.amt), open: !pt.won, won: pt.won,\n        winnersLabel: pt.winners.map(w => ps[w].name).join(' & '),\n        awardOp: pt.sel.length ? 1 : 0.35,\n        onAward: () => this.award(pi),\n        players: pt.elig.map(i => { const sel = pt.sel.includes(i); return { key: i, name: ps[i].name, bc: sel ? '#0E5A3C' : 'rgba(0,0,0,.16)', bg: sel ? '#0E5A3C' : '#fff', fg: sel ? '#fff' : '#191919', on: () => this.mut(st => { const q = st.pots[pi]; q.sel = q.sel.includes(i) ? q.sel.filter(x => x !== i) : [...q.sel, i]; }) }; }),\n      })),\n      endRows: ps.map((p, i) => ({ key: i, name: p.name, initial: p.name[0].toUpperCase(), stackFmt: fmt(p.stack), tag: p.stack === 0 || p.out ? 'Busted' : i === s.dealer ? 'Dealer' : '', op: p.out || p.stack === 0 ? 0.4 : 1 })),\n      nextHand: () => this.nextHand(),\n      resetAll: () => this.setState({ screen: 'home', players: [], view: 0, dealer: 0, handNo: 1, pots: null, endMsg: '', acting: -1 }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
