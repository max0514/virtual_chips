<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      viewport-fit=cover lets the app paint under the notch and the home
      indicator; the action bar pays that back with env(safe-area-inset-bottom).
      user-scalable=no is here for a specific reason rather than as a habit:
      the action buttons sit under the thumb and a mis-hit double-tap that zooms
      the table mid-hand is worse than the accessibility cost of pinch-zoom on a
      screen whose smallest text is 11px on a 390px-wide layout.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />

    <title>Pocket Dealer</title>
    <meta
      name="description"
      content="Virtual poker chips for in-person Texas Hold'em. The chips live here, the cards stay on the table."
    />

    <!-- Add to Home Screen on iOS: standalone launch, no Safari chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dealer" />
    <!-- default = the status bar text stays dark, which suits the light page. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#FBFAF8" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
